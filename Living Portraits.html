<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Living Portraits — The Last Human</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root { --mono: "JetBrains Mono", monospace; --display: "Space Mono", monospace; --ink: oklch(0.95 0.01 200); --dim: oklch(0.72 0.02 210); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #000; }
  body { font-family: var(--mono); color: var(--ink); user-select: none; cursor: default; }
  #stage { position: fixed; inset: 0; overflow: hidden; }

  .layer { position: absolute; inset: 0; }
  /* blurred wallpaper backdrop */
  #bg { background-size: cover; background-position: center; filter: blur(34px) brightness(0.42) saturate(1.1); transform: scale(1.18); }
  /* sharp subject, contained + breathing ken-burns */
  #fgwrap { display: grid; place-items: center; will-change: transform; transition: transform 0.18s ease-out; }
  #fg { max-width: 100%; max-height: 100%; object-fit: contain; will-change: transform, filter; animation: breathe 16s ease-in-out infinite alternate; box-shadow: 0 30px 90px rgba(0,0,0,0.6); }
  @keyframes breathe { from { transform: scale(1.0); } to { transform: scale(1.06); } }

  #fx { mix-blend-mode: screen; pointer-events: none; }
  #grade { pointer-events: none; }
  #vignette { pointer-events: none; box-shadow: inset 0 0 240px 60px rgba(0,0,0,0.7); }
  #grain { position: absolute; inset: -50%; pointer-events: none; opacity: 0.05; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); animation: grain 0.5s steps(2) infinite; }
  @keyframes grain { 0%{transform:translate(0,0)} 50%{transform:translate(-3%,2%)} 100%{transform:translate(2%,-2%)} }

  /* fade between images */
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; z-index: 8; }
  #fade.on { opacity: 1; }

  .cap { position: absolute; left: 36px; bottom: 34px; z-index: 10; }
  .cap .k { font-size: 10px; letter-spacing: 0.4em; color: var(--dim); text-transform: uppercase; }
  .cap .t { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: 0.04em; margin-top: 6px; text-shadow: 0 2px 20px rgba(0,0,0,0.8); }

  #dots { position: absolute; right: 32px; bottom: 38px; z-index: 10; display: flex; gap: 12px; }
  #dots button { width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.5); background: transparent; cursor: pointer; padding: 0; transition: 0.25s; }
  #dots button.on { background: var(--ink); box-shadow: 0 0 14px rgba(255,255,255,0.7); }

  #hud { position: absolute; top: 22px; right: 26px; z-index: 10; display: flex; gap: 16px; align-items: center; }
  #hud .h { font-size: 10px; letter-spacing: 0.3em; color: var(--dim); }
  .mute { background: none; border: 1px solid rgba(255,255,255,0.2); color: var(--dim); font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; padding: 7px 11px; cursor: pointer; }
  .mute:hover { color: var(--ink); border-color: rgba(255,255,255,0.45); }

  #begin { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(0,0,0,0.55); cursor: pointer; transition: opacity 0.6s; }
  #begin.gone { opacity: 0; pointer-events: none; }
  #begin .b { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #begin .bt { font-family: var(--display); font-weight: 700; font-size: clamp(26px,4vw,42px); letter-spacing: 0.05em; }
  #begin .bs { font-size: 11px; letter-spacing: 0.36em; color: var(--dim); text-transform: uppercase; animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }
  .hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 10; font-size: 10px; letter-spacing: 0.3em; color: var(--dim); text-transform: uppercase; opacity: 0.6; }
</style>
</head>
<body>
  <div id="stage">
    <div class="layer" id="bg"></div>
    <div class="layer" id="fgwrap"><img id="fg" alt="" /></div>
    <canvas class="layer" id="fx"></canvas>
    <div class="layer" id="grade"></div>
    <div class="layer" id="vignette"></div>
    <div id="grain"></div>
    <div class="layer" id="fade"></div>

    <div class="cap"><div class="k" id="capk">scene</div><div class="t" id="capt">—</div></div>
    <div id="dots"></div>

    <div id="hud">
      <span class="h" id="mode">RAIN</span>
      <button class="mute" id="mute">♪ SOUND ON</button>
    </div>
    <div class="hint">← → switch · move mouse to look</div>

    <div id="begin"><div class="b"><div class="bt">LIVING PORTRAITS</div><div class="bs">click to enter</div></div></div>
  </div>

  <script>
  (function () {
    "use strict";
    const $ = (s) => document.querySelector(s);
    const SCENES = [
      { src: "assets/duckling.png", k: "in the rain", t: "CADET", mode: "rain",     grade: "linear-gradient(180deg, rgba(20,45,70,0.22), rgba(10,20,30,0.32))" },
      { src: "assets/mecha.png",    k: "overgrown",  t: "GARDENER UNIT", mode: "garden", grade: "linear-gradient(180deg, rgba(60,45,15,0.10), rgba(20,30,15,0.22))" },
      { src: "assets/girl.png",     k: "portrait",   t: "THE LAST HUMAN", mode: "portrait", grade: "linear-gradient(180deg, rgba(40,28,16,0.10), rgba(20,16,12,0.20))" }
    ];
    let idx = 0, started = false;

    const fg = $("#fg"), bg = $("#bg"), fade = $("#fade");
    const cnv = $("#fx"), ctx = cnv.getContext("2d");
    let W = 0, H = 0, dpr = Math.min(devicePixelRatio || 1, 2);
    function resize() { W = innerWidth; H = innerHeight; cnv.width = W * dpr; cnv.height = H * dpr; cnv.style.width = W + "px"; cnv.style.height = H + "px"; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
    addEventListener("resize", resize); resize();

    // ---- particles ----
    let drops = [], splashes = [], leaves = [], dust = [];
    function seed() {
      drops = Array.from({ length: 320 }, () => ({ x: Math.random() * W, y: Math.random() * H, l: 12 + Math.random() * 26, s: 9 + Math.random() * 9, near: Math.random() < 0.12 }));
      leaves = Array.from({ length: 36 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: 4 + Math.random() * 7, a: Math.random() * 6.28, sp: 0.3 + Math.random() * 0.6, dr: (Math.random() - 0.5) * 0.4, hue: Math.random() < 0.5 ? "120,180,80" : "230,160,70" }));
      dust = Array.from({ length: 60 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: 0.6 + Math.random() * 2.2, ph: Math.random() * 6.28, sp: 0.15 + Math.random() * 0.4 }));
    }
    seed(); addEventListener("resize", seed);

    const wind = 2.2;
    let t = 0, lastRain = 0;
    function draw(dt) {
      t += dt;
      ctx.clearRect(0, 0, W, H);
      const m = SCENES[idx].mode;

      if (m === "rain") {
        ctx.lineCap = "round";
        for (const d of drops) {
          d.y += d.s * dt * 60; d.x += wind * dt * 60;
          if (d.y > H + 20) { d.y = -20; d.x = Math.random() * W; }
          if (d.near) { ctx.strokeStyle = "rgba(200,225,255,0.10)"; ctx.lineWidth = 2.4; }
          else { ctx.strokeStyle = "rgba(190,215,245,0.34)"; ctx.lineWidth = 1; }
          ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - wind * 1.6, d.y - d.l); ctx.stroke();
        }
        if (t - lastRain > 0.04) { lastRain = t; splashes.push({ x: Math.random() * W, y: H * (0.7 + Math.random() * 0.3), r: 1, a: 0.5 }); }
        for (let i = splashes.length - 1; i >= 0; i--) { const s = splashes[i]; s.r += dt * 60; s.a -= dt * 1.2; if (s.a <= 0) { splashes.splice(i, 1); continue; } ctx.strokeStyle = `rgba(210,230,255,${s.a})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(s.x, s.y, s.r, s.r * 0.4, 0, 0, 6.28); ctx.stroke(); }
      } else if (m === "garden") {
        // warm light shafts
        for (let i = 0; i < 4; i++) { const x = W * (0.1 + i * 0.22) + Math.sin(t * 0.2 + i) * 20; const g = ctx.createLinearGradient(x, 0, x + 120, H); g.addColorStop(0, "rgba(255,225,150,0.07)"); g.addColorStop(1, "rgba(255,225,150,0)"); ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 50, 0); ctx.lineTo(x + 220, H); ctx.lineTo(x + 120, H); ctx.closePath(); ctx.fill(); }
        for (const l of leaves) { l.y -= l.sp * dt * 30; l.x += (Math.sin(t + l.a) * 0.5 + l.dr) * dt * 30; l.a += dt; if (l.y < -20) { l.y = H + 20; l.x = Math.random() * W; } const al = 0.4 + 0.3 * Math.sin(t + l.a); ctx.fillStyle = `rgba(${l.hue},${al})`; ctx.beginPath(); ctx.ellipse(l.x, l.y, l.r, l.r * 0.5, l.a, 0, 6.28); ctx.fill(); }
        for (const p of dust) { const a = 0.3 + 0.4 * Math.sin(t * 1.4 + p.ph); ctx.fillStyle = `rgba(255,240,200,${a})`; ctx.fillRect(p.x, p.y, p.r, p.r); p.y -= p.sp * dt * 18; if (p.y < 0) p.y = H; }
      } else {
        // portrait — soft floating bokeh dust
        for (const p of dust) { p.y -= p.sp * dt * 14; p.x += Math.sin(t * 0.5 + p.ph) * dt * 8; if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; } const a = 0.18 + 0.22 * Math.sin(t * 1.1 + p.ph); const r = p.r * 3; const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r); g.addColorStop(0, `rgba(255,240,220,${a})`); g.addColorStop(1, "rgba(255,240,220,0)"); ctx.fillStyle = g; ctx.fillRect(p.x - r, p.y - r, r * 2, r * 2); }
      }
    }
    let last = performance.now(), lastTick = last;
    function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; lastTick = now; draw(dt); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);
    setInterval(() => { if (performance.now() - lastTick > 220) { last = performance.now(); draw(0.05); } }, 200);

    // ---- parallax ----
    const fgwrap = $("#fgwrap");
    addEventListener("mousemove", (e) => { const dx = (e.clientX / innerWidth - 0.5), dy = (e.clientY / innerHeight - 0.5); fgwrap.style.transform = `translate(${dx * -26}px, ${dy * -18}px)`; bg.style.transform = `scale(1.18) translate(${dx * 14}px, ${dy * 10}px)`; });

    // ---- scene switch ----
    function setScene(i, instant) {
      idx = (i + SCENES.length) % SCENES.length;
      const s = SCENES[idx];
      const apply = () => { fg.src = s.src; bg.style.backgroundImage = `url("${s.src}")`; $("#capk").textContent = s.k; $("#capt").textContent = s.t; $("#mode").textContent = s.mode.toUpperCase(); $("#grade").style.background = s.grade; document.querySelectorAll("#dots button").forEach((b, j) => b.classList.toggle("on", j === idx)); audioMode(s.mode); };
      if (instant) { apply(); return; }
      fade.classList.add("on");
      setTimeout(() => { apply(); fade.classList.remove("on"); }, 360);
    }
    // dots
    SCENES.forEach((s, i) => { const b = document.createElement("button"); b.addEventListener("click", () => setScene(i)); $("#dots").appendChild(b); });
    addEventListener("keydown", (e) => { if (e.code === "ArrowRight") setScene(idx + 1); else if (e.code === "ArrowLeft") setScene(idx - 1); });

    // ---- audio (procedural rain + ambient) ----
    let actx, master, rainGain, padGain, noiseSrc, muted = false, curMode = "rain", chirpTimer;
    function audioInit() {
      if (actx) return;
      const AC = window.AudioContext || window.webkitAudioContext; actx = new AC();
      master = actx.createGain(); master.gain.value = 0; master.connect(actx.destination);
      // noise buffer
      const len = actx.sampleRate * 2, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0); let lp = 0;
      for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; lp = (lp + 0.02 * w) / 1.02; d[i] = lp * 3.2; }
      noiseSrc = actx.createBufferSource(); noiseSrc.buffer = buf; noiseSrc.loop = true;
      const bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1400; bp.Q.value = 0.5;
      rainGain = actx.createGain(); rainGain.gain.value = 0;
      noiseSrc.connect(bp); bp.connect(rainGain); rainGain.connect(master); noiseSrc.start();
      // soft pad
      padGain = actx.createGain(); padGain.gain.value = 0; padGain.connect(master);
      [110, 165, 220].forEach((f, i) => { const o = actx.createOscillator(); o.type = "sine"; o.frequency.value = f; const g = actx.createGain(); g.gain.value = 0.06 / (i + 1); o.connect(g); g.connect(padGain); o.start(); });
    }
    function ramp(p, v, tm) { const n = actx.currentTime; p.cancelScheduledValues(n); p.setValueAtTime(p.value, n); p.linearRampToValueAtTime(v, n + tm); }
    function chirp() { if (!actx || muted) return; const n = 2 + (Math.random() * 2 | 0), f0 = 1700 + Math.random() * 1200; for (let i = 0; i < n; i++) { const o = actx.createOscillator(); o.type = "sine"; const g = actx.createGain(); const tt = actx.currentTime + i * 0.09; o.frequency.setValueAtTime(f0 * (0.9 + Math.random() * 0.3), tt); o.frequency.exponentialRampToValueAtTime(f0 * 1.3, tt + 0.05); g.gain.setValueAtTime(0.0001, tt); g.gain.linearRampToValueAtTime(0.04, tt + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.08); o.connect(g); g.connect(master); o.start(tt); o.stop(tt + 0.1); } }
    function drip() { if (!actx || muted) return; const o = actx.createOscillator(); o.type = "sine"; const g = actx.createGain(); const tt = actx.currentTime, f = 700 + Math.random() * 500; o.frequency.setValueAtTime(f, tt); o.frequency.exponentialRampToValueAtTime(f * 0.32, tt + 0.16); g.gain.setValueAtTime(0.0001, tt); g.gain.linearRampToValueAtTime(0.12, tt + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.4); o.connect(g); g.connect(master); o.start(tt); o.stop(tt + 0.45); }
    function audioMode(m) {
      curMode = m; if (!actx) return;
      ramp(rainGain.gain, m === "rain" ? 0.5 : 0.0, 1.4);
      ramp(padGain.gain, m === "rain" ? 0.5 : m === "garden" ? 0.7 : 0.9, 1.6);
      clearInterval(chirpTimer);
      if (m === "rain") chirpTimer = setInterval(() => { if (Math.random() < 0.7) drip(); }, 1400);
      else if (m === "garden") chirpTimer = setInterval(() => { if (Math.random() < 0.8) chirp(); }, 2600);
    }
    $("#mute").addEventListener("click", (e) => { e.stopPropagation(); muted = !muted; if (actx) ramp(master.gain, muted ? 0.0001 : 0.85, 0.4); e.target.textContent = muted ? "♪ SOUND OFF" : "♪ SOUND ON"; });

    function begin() { if (started) return; started = true; $("#begin").classList.add("gone"); audioInit(); if (actx.state === "suspended") actx.resume(); ramp(master.gain, 0.85, 1.4); audioMode(SCENES[idx].mode); }
    $("#begin").addEventListener("click", begin);

    // init
    setScene(0, true);
  })();
  </script>
</body>
</html>
